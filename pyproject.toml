[project]
name = "empulse"
version = "0.2.21"
description = "Activity monitoring for Emby Server"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.160",
    "uvicorn[standard]~=0.54",
    "aiosqlite~=0.22",
    "httpx~=0.28",
    "websockets~=17.3",
    "pydantic-settings~=2.16",
    "jinja2~=3.1",
    "python-dotenv~=1.2",
    "python-multipart~=0.0.32",
    "tzdata",  # zoneinfo fallback when the OS lacks tz data (e.g. US/* on Ubuntu 24.04)
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["empulse*"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
